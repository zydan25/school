name: Mobile CI

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/mobile-expo-foundation
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install dependencies
        run: npm install

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: TypeScript type check
        run: npm run typecheck

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/school-mobile-export-check
