name: School ERP CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-sqlite-tests:
    name: Lint, Django checks and SQLite tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "ci-test-secret-key-for-school-erp-system-checks-only-12345"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Ruff lint (changed API and domain modules)
        run: |
          ruff check \
            apps/accounts/api_permissions.py \
            apps/tenants/middleware.py \
            apps/tenants/services.py \
            apps/api/views.py \
            apps/payroll/services.py \
            apps/payroll/models.py \
            apps/payroll/hr_services.py \
            apps/payroll/api/serializers.py \
            apps/payroll/api/views.py \
            apps/payroll/api/urls.py \
            apps/payroll/api/hr_serializers.py \
            apps/payroll/api/hr_views.py \
            apps/payroll/migrations/0005_stage9_hr_workflows.py \
            apps/staff/models.py \
            apps/staff/services/leave_service.py \
            apps/staff/api/serializers.py \
            apps/staff/api/views.py \
            apps/staff/admin.py \
            apps/staff/migrations/0004_stage9_leave_audit.py \
            apps/student_fees/models.py \
            apps/student_fees/admin.py \
            apps/student_fees/api/serializers.py \
            apps/student_fees/api/urls.py \
            apps/student_fees/api/views.py \
            apps/student_fees/api/workflow_views.py \
            apps/students/models.py \
            apps/students/admin.py \
            apps/accounting/models.py \
            apps/accounting/admin.py \
            apps/accounting/services/auto_posting.py \
            apps/accounting/services/financial_reports.py \
            apps/accounting/services/period_closing.py \
            apps/accounting/services/treasury.py \
            apps/accounting/migrations/0004_stage8_fiscal_controls.py \
            apps/accounting/migrations/0005_stage8_treasury.py \
            apps/accounting/migrations/0006_stage8_voucher_idempotency.py \
            apps/accounting/migrations/0007_stage8_treasury_defaults.py \
            apps/reports/views.py \
            apps/reports/urls.py \
            apps/payroll/services.py \
            tests/test_stage8_accounting.py \
            tests/test_finance_and_attendance.py \
            tests/test_report2_fixes.py \
            tests/test_audit_fixes.py \
            tests/test_taqrerr_fixes.py \
            tests/test_stage7_student_fees.py \
            apps/school_services/models.py \
            apps/tenants/admin.py \
            apps/attendance/api/serializers.py \
            apps/attendance/api/urls.py \
            apps/attendance/api/views.py \
            apps/attendance/services/attendance_service.py \
            apps/attendance/services/excuse_service.py \
            apps/api/v1/serializers.py \
            apps/api/v1/urls.py \
            apps/api/v1/views.py \
            apps/assignments/models.py \
            apps/assignments/admin.py \
            apps/assignments/migrations/0004_homework_submission_attempts.py \
            apps/assessments/models.py \
            apps/assessments/admin.py \
            apps/assessments/migrations/0006_grade_and_exam_workflows.py \
            apps/notifications/models.py \
            apps/notifications/migrations/0004_pushdevice_schoolconversation.py \
            apps/staff/api/urls.py \
            apps/staff/api/views.py \
            tests/test_api_school_context.py \
            tests/test_mobile_api_contracts.py \
            tests/test_stage6_teaching_assessments.py \
            --ignore I001,B904

      - name: Django system checks
        run: python manage.py check

      - name: Verify migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite on SQLite
        run: python manage.py test tests --verbosity=2

  postgres-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: school
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/school"
      SECRET_KEY: "ci-test-secret-key-for-school-erp-system-checks-only-12345"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Verify migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite on PostgreSQL
        run: python manage.py test tests --verbosity=2
