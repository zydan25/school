name: Android APK - Madrasati

on:
  push:
    branches:
      - feature/mobile-madrasati-android
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

# Queue another APK build instead of cancelling the build already in progress.
concurrency:
  group: madrasati-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Madrasati standalone ARM64 APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: https://school.alattab.site/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Validate Expo dependencies and TypeScript
        working-directory: mobile
        run: |
          npx expo install --check
          npm run typecheck

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify network permissions and HTTPS-only policy
        working-directory: mobile
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"
          if grep -q 'usesCleartextTraffic="true"' "$MANIFEST"; then
            echo "Cleartext HTTP must remain disabled."
            exit 1
          fi

      # Release variant embeds the app bundle and does not open the Expo Dev Launcher.
      # ARM64 is retained for the target physical Android phone used for this test.
      - name: Assemble standalone Release APK (ARM64 only)
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --build-cache \
            --max-workers=2 \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --info

      - name: Verify standalone APK output
        working-directory: mobile
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Madrasati standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: madrasati-android-arm64-standalone-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: madrasati-android-build-diagnostics
          path: |
            mobile/android/app/.cxx/**
            mobile/android/.gradle/**
            mobile/android/build/reports/**
            mobile/android/app/build/reports/**
            mobile/android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
