name: Extract uploaded School source archive

on:
  workflow_dispatch:
  push:
    paths:
      - "School-Stage1-Source.zip"
      - ".github/workflows/extract-school-source.yml"

permissions:
  contents: write

concurrency:
  group: extract-school-source
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate and extract archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("School-Stage1-Source.zip")
          if not archive.is_file():
              raise SystemExit("ERROR: School-Stage1-Source.zip was not found in repository root")

          root = Path.cwd().resolve()
          with ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ERROR: corrupt ZIP member: {bad}")
              for item in zf.infolist():
                  target = (root / item.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"ERROR: unsafe ZIP path: {item.filename}")
              zf.extractall(root)

          required = ["manage.py", "pyproject.toml", "apps/core/models.py", "apps/tenants/models.py",
                      "apps/accounts/models.py", "apps/academics/models.py", "apps/platform/models.py"]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit("ERROR: missing required stage-one files: " + ", ".join(missing))
          print("SUCCESS: ZIP integrity and expected Django project structure verified.")
          PY

      - name: Remove archive and commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          rm -f School-Stage1-Source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The connected GitHub App currently lacks the 'workflows' permission.
          # Keep CI workflow definitions out of this bot push; add them after granting that permission.
          git add -A
          git reset -q -- .github/workflows/ci.yml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ERROR: extraction produced no committable source changes."
            exit 1
          fi

          git commit -m "Extract School stage one source archive"
          git push origin HEAD:main
